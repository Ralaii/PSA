# APPLICATION
spring.application.name=psa
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# DOCKER
spring.docker.compose.enabled=false

# DATABASE
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# REDIS
spring.cache.type=redis
spring.data.redis.host=${CACHE_HOST}
spring.data.redis.port=${CACHE_PORT}

# REDIS CONFIG
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.cache.redis.time-to-live=1d

#CONFIG FOR PERFORMANCE QUERIES
spring.jpa.properties.hibernate.generate_statistics=true
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=50
spring.jpa.show-sql=true

# JPA / HIBERNATE
spring.jpa.hibernate.ddl-auto=validate

# FLYWAY
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=60000

# SESSION
session.idle-timeout-minutes=240

# SECURITY / CORS
app.cookie.secure=false
allowed.origins=${ORIGINS}

# LOGGING
logging.level.org.springframework.security=DEBUG